{% extends "base.html" %}

{% block content %}

<h3 class="mb-4">File Records</h3>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Filename</th>
            <th>Hash</th>
            <th>Upload Time</th>
        </tr>
    </thead>
    <tbody>
        {% for row in records %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td style="font-size: 12px;">{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="mt-3">
    <a href="/report" class="btn btn-secondary">
        Download PDF Report
    </a>
</div>

{% endblock %}
