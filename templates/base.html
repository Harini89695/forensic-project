<!DOCTYPE html>
<html>

<head>
    <title>Digital Forensics System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Digital Forensics File Integrity and Evidence Management System">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-lock"></i> Digital Forensics System
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto">
                    {% if session.get("user") %}
                    <a class="btn btn-outline-light btn-sm me-1" href="/upload">
                        <i class="bi bi-cloud-arrow-up"></i> Upload
                    </a>
                    <a class="btn btn-outline-light btn-sm me-1" href="/verify">
                        <i class="bi bi-check-circle"></i> Verify
                    </a>
                    <a class="btn btn-outline-light btn-sm me-1" href="/fingerprint">
                        <i class="bi bi-fingerprint"></i> Fingerprint
                    </a>
                    <a class="btn btn-outline-light btn-sm me-1" href="/logs">
                        <i class="bi bi-journal-text"></i> Logs
                    </a>
                    <span class="text-light me-2 ms-2 small">
                        <i class="bi bi-person-circle"></i> {{ session.get("user") }}
                    </span>
                    <a class="btn btn-danger btn-sm" href="/logout">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                    {% else %}
                    <a class="btn btn-outline-light btn-sm" href="/login">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
